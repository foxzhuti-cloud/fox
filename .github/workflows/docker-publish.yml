name: Build and Push Docker Image to Docker Hub

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"

          if [ -z "$USERNAME" ]; then
            echo ""
            echo "=============================================="
            echo "  DOCKERHUB_USERNAME secret is EMPTY."
            echo "  Go here to set it:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  Click 'New repository secret'"
            echo "  Name:  DOCKERHUB_USERNAME"
            echo "  Value: foxzhuti"
            echo "=============================================="
            echo ""
            exit 1
          fi

          if [ -z "$TOKEN" ]; then
            echo ""
            echo "=============================================="
            echo "  DOCKERHUB_TOKEN secret is EMPTY."
            echo "  Go to https://hub.docker.com/settings/security"
            echo "  Create a new Access Token (Read & Write)."
            echo "  Then go here to set it:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  Name:  DOCKERHUB_TOKEN"
            echo "  Value: <paste the token>"
            echo "=============================================="
            echo ""
            exit 1
          fi

          echo "Logging in as: $USERNAME"
          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-web-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-web-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hermes-web-ui:${{ github.ref_name || github.event.release.tag_name }}
